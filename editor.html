  <body>
    <!--
      2.4.1, Bypass Blocks. The editor's title bar is eight controls and its
      sidebar is a whole resource tree; without this, reaching the canvas by
      keyboard means walking both on every load.
    -->
    <a class="skip-link" href="#editor-canvas-area">Skip to the editing area</a>

    <!--
      The page's one `<h1>`. The editor builds its chrome in script and had no
      heading at all, so a screen reader's document outline began at the `<h3>`
      of a sidebar section — and "what is this page" had no answer.
    -->
    <h1 class="visually-hidden">MGI Web editor</h1>

    <div id="editor"></div>

    <!--
      Shown only when arriving from the player's "Edit game…", which hands over
      a decompiled project this page then has to rebuild. Marked up here and
      unhidden by a plain inline script so it paints with the first frame: the
      editor bundle is a deferred module, and waiting for it would leave the
      screen blank for exactly the stretch this covers.
    -->
    <div id="boot-busy" class="busy-overlay" role="status" aria-live="polite" hidden>
      <div class="busy-spinner" aria-hidden="true"></div>
      <p class="busy-message">Opening the decompiled game…</p>
      <p class="busy-hint">Rebuilding the rooms, costumes and scripts as an editable project.</p>
    </div>
    <script>
      if (new URLSearchParams(location.search).has('imported')) {
        document.getElementById('boot-busy').hidden = false;
      }
    </script>

    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
